# Dependency policy for cargo-deny (licenses, advisories, bans, sources).
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The project's own crates are MIT. Allowed third-party licenses are added here
# as dependencies are adopted; nothing is allowlisted pre-emptively.
#
# `Zlib` was added with the M0 backend slice: `slotmap` (through Taffy) and
# `foldhash` (through Parley's hashbrown use) are Zlib-licensed. Zlib is
# OSI-approved and permissive, with no copyleft or attribution-in-binary
# requirement beyond retaining the notice.
# `BSD-2-Clause` (`arrayref`) and `BSD-3-Clause` (`tiny-skia`,
# `tiny-skia-path`) enter transitively through resvg for SVG rasterization.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-2-Clause", "BSD-3-Clause"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
