# Dependency policy for cargo-deny (licenses, advisories, bans, sources).
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The project's own crates are MIT. Allowed third-party licenses are added here
# as dependencies are adopted; nothing is allowlisted pre-emptively.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
